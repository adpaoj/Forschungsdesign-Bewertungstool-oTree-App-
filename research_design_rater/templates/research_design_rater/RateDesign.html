{% extends "global/Page.html" %}
{% block content %}

<h4>Design ({{ current }} / {{ total }})</h4>

<div style="display:flex; gap:20px;">

  <!-- PDF viewer -->
  <div style="flex:1; border:1px solid #ddd; padding:10px;">
    <iframe
      src="{% static pdf_path %}"
      width="100%"
      height="600px"
      style="border:none;">
    </iframe>
  </div>

  <!-- Rating form -->
  <div style="width:360px; border:1px solid #eee; padding:12px;">
    <form method="post">
      {{ formfields }}
      <button class="btn btn-primary mt-2">Weiter</button>
    </form>
  </div>

</div>

{% endblock %}
